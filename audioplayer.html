<html>
    
    <head>
        <title>audioplayer</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
        <style> 
            body{font-family: "Jersey 10"}

            input[type=file]{color:transparent}

            .slider
            {
                -webkit-appearance: none;
                --pc: 0;
                --color: #000000;
                --bgcolor: transparent;
                --border: #000000;
                --outline_width: 4px;
                --height: 12px;
                --border_radius: 6px;
                --dot_size: 20px;
                height: var(--height);
                background: linear-gradient(to right, transparent 0 var(--pc), var(--bgcolor) var(--pc) 100%), var(--color);
                background-origin: content-box;
                outline: solid;
                outline-color: var(--border);
                outline-width: var(--outline_width);
                border-radius: var(--border_radius);
                overflow: visible;
            }
            .slider::-webkit-slider-runnable-track {position: relative;}
            .slider::-webkit-slider-thumb
            {
                -webkit-appearance: none;
                border-radius: 50%;
                width: var(--dot_size);
                height: var(--dot_size);
                outline: solid;
                outline-color: var(--border);
                outline-width: var(--outline_width);
                background: var(--color);
            }

            .ci
            {
                --size: 30;
                --p: 4;
                --w: 58;
                --m: -29;
                padding: 0 var(--size) 0 var(--size);
            }
            input.ci::-webkit-color-swatch-wrapper
            {
                padding: var(--p);
                margin-left: var(--m);
                width: var(--w);
            }
        </style>
    </head>

    <body>

        <div style="display: flex; justify-content: center; align-items: center; font-size: 200%;">
            <label for="audio-upload">Upload song folder: </label>
        </div>
        <div style="display: flex; justify-content: center; align-items: center; margin-left: 185px;">
            <input id="audio-upload" type="file" webkitdirectory multiple/>
        </div>
        <table id="colortable">
            <tr>
                <th><p><label for="textcolor" id="l1">text</label></p></th>
                <th><p><label for="barcolor" id="l2">bars</label></p></th>
                <th><p><label for="barbgcolor" id="l3">bar bg</label></p></th>
                <th><p><label for="bgcolor" id="l4">bg</label></p></th>
            </tr>
            <tr>
                <td><input type="color" id="textcolor" class="ci"></td>
                <td><input type="color" id="barcolor" class="ci"></td>
                <td><input type="color" id="barbgcolor" class="ci"></td>
                <td><input type="color" id="bgcolor" class="ci"></td>
            </tr>
        </table>
        <div>
            <input id="volumeslider" type="range" min="0" max="100" class="slider">
        </div>

        <script>
            if (document.body.clientHeight > document.body.clientWidth)
                document.body.children[0].style.fontSize = "75px"

            let textcolor = "#CC1818"
            let backgroundcolor = "#000000"
            let barcolor = "#CC1818"
            let barbgcolor = "#d3d3d3"
            let barbordercolor = "#000000"

            let playlist = []
            let pindex = -1

            document.body.style.color = textcolor
            document.body.style.backgroundColor = backgroundcolor

            table = document.getElementById("colortable")

            for(i = 0; i < 4; i++)
                table.rows[0].cells[i].style.color = textcolor

            colors = [document.getElementById("textcolor"),document.getElementById("barcolor"),document.getElementById("barbgcolor"),document.getElementById("bgcolor")]
            labels =[document.getElementById("l1"),document.getElementById("l2"),document.getElementById("l3"),document.getElementById("l4")]

            table.style.position = "absolute"
            table.style.right = "10%"
            table.style.bottom = "90%"

            let audiobar = document.getElementById("volumeslider")

            colors[0].value = textcolor
            colors[0].oninput = function()
            {
                textcolor = colors[0].value
                document.body.style.color = textcolor
                for(i = 0; i < 4; i++)
                    table.rows[0].cells[i].style.color = textcolor
            }
            colors[1].value = barcolor
            colors[1].oninput = function()
            {
                barcolor = colors[1].value
                audiobar.style.setProperty('--color', barcolor)
                document.body.children[static_element_num+1].children[0].style.setProperty('--color', barcolor)
            }
            colors[2].value = barbgcolor
            colors[2].oninput = function()
            {
                barbgcolor = colors[2].value
                audiobar.style.setProperty('--bgcolor', barbgcolor)
                document.body.children[static_element_num+1].children[0].style.setProperty('--bgcolor', barbgcolor)
            }
            colors[3].value = bgcolor
            colors[3].oninput = function()
            {
                bgcolor = colors[3].value
                barbordercolor = colors[3].value
                document.body.style.backgroundColor = bgcolor
                audiobar.style.setProperty('--border', barbordercolor)
                document.body.children[static_element_num+1].children[0].style.setProperty('--border', barbordercolor)
            }

            audiobar.value = 50
            audiobar.style.width = "15%"
            audiobar.style.position = "absolute"
            audiobar.style.bottom = "92%"
            audiobar.style.right = "75%"
            audiobar.type = "range"

            audiobar.style.setProperty('--color', barcolor)
            audiobar.style.setProperty('--bgcolor', barbgcolor)
            audiobar.style.setProperty('--border', barbordercolor)
            audiobar.style.setProperty('--pc', '50%')

            audiobar.oninput = function(){
                pc = (audiobar.value - audiobar.min) / (audiobar.max - audiobar.min) * 100;
                audiobar.style.setProperty('--pc', pc + '%');
                audio = document.body.children[static_element_num].children[1]
                audio.volume = audiobar.value/100
            }

            if (document.body.clientHeight > document.body.clientWidth)
            {
                for(i = 0; i < 4; i++)
                {
                    colors[i].style.setProperty('--size',"45")
                    colors[i].style.setProperty('--p',"4")
                    colors[i].style.setProperty('--m',"-45")
                    colors[i].style.setProperty('--w',"90")
                    colors[i].style.height = 40

                    labels[i].style.fontSize = 32
                }
                table.style.bottom = "84.5%"
                table.style.right = "5%"
                audiobar.style.bottom = "85%"
                audiobar.style.width = "40%"
                audiobar.style.right = "55%"
                audiobar.style.setProperty('--outline_width', "5px")
                audiobar.style.setProperty('--height', "20px")
                audiobar.style.setProperty('--border_radius', "10px")
                audiobar.style.setProperty('--dot_size', "32px")
            }

            let static_element_num = document.body.children.length

            function createfilearray({target})
            {
                if (!target.files.length) return

                pindex = -1
                playlist = []
                allowed = /(\.ogg|\.mp3|\.wav|\.opus)$/i;

                for(let i = 0; i < target.files.length; i++)
                {
                    if(allowed.exec(target.files[i].name))
                        playlist.push(target.files[i])
                }

                shuffle(playlist)
            }

            function playsong()
            {
                if (playlist.length < 1) return

                urlObj = URL.createObjectURL(playlist[pindex]);

                while (document.body.children.length > static_element_num) 
                    document.body.removeChild(document.body.lastChild);

                let songdiv = document.createElement("div")

                let audio = document.createElement("audio");

                //Clean up
                audio.addEventListener("load", () => {URL.revokeObjectURL(urlObj);});

                //Set the src and start loading the audio from the file
                audio.src = urlObj;

                audio.volume = audiobar.value/100

                //song info
                let songinfo = document.createElement("p");
                songinfo.style.position = "absolute"
                songinfo.style.bottom = "16%"
                songinfo.style.fontSize = "40px"

                //song name
                songinfo.appendChild(document.createTextNode(playlist[pindex].name.replace(/\.[^/\\.]+$/, "")))

                audio.onloadedmetadata = (event) => 
                {   
                    //song duration
                    duration = pad(Math.floor(audio.duration / 60),2) + ":" + pad(Math.floor(audio.duration % 60),2)
                    durationtxt = document.createElement("p")
                    durationtxt.innerHTML = duration
                    durationtxt.style.position = "absolute"
                    durationtxt.style.bottom = "2%"
                    durationtxt.style.fontSize = "40px"
                    
                    //progressbar with slider
                    progressbardiv = document.createElement("div")
                    progressbar = document.createElement("input")
                    progressbar.className = "slider"
                    progressbar.value = 0
                    progressbar.max = audio.duration
                    progressbar.min = 0
                    progressbar.style.width = "75%"
                    progressbar.style.position = "absolute"
                    progressbar.style.bottom = "16%"
                    progressbar.type = "range"

                    if (document.body.clientHeight > document.body.clientWidth)
                    {
                        songinfo.style.fontSize = "60px"
                        durationtxt.style.fontSize = "90px"
                        progressbar.style.bottom = "17%" 
                        songinfo.style.bottom = "17%"
                        durationtxt.style.bottom = "3%"
                        progressbar.style.setProperty('--outline_width', "5px")
                        progressbar.style.setProperty('--height', "20px")
                        progressbar.style.setProperty('--border_radius', "10px")
                        progressbar.style.setProperty('--dot_size', "32px")
                    }

                    progressbar.style.setProperty('--color', barcolor)
                    progressbar.style.setProperty('--bgcolor', barbgcolor)
                    progressbar.style.setProperty('--border', barbordercolor)
                    progressbar.oninput = function()
                    {
                        audio.currentTime =  progressbar.value
                        
                        pc = (progressbar.value - progressbar.min) / (progressbar.max - progressbar.min) * 100;
                        if (pc < 20) {pc++}
                        progressbar.style.setProperty('--pc', pc + '%');
                    }

                    songdiv.appendChild(songinfo)
                    songdiv.appendChild(audio)
                    songdiv.appendChild(durationtxt)

                    progressbardiv.appendChild(progressbar)

                    songdiv.style.display = "flex"
                    songdiv.style.justifyContent ="center"
                    songdiv.align = "center"

                    progressbardiv.style.display = "flex"
                    progressbardiv.style.justifyContent = "center"
                    progressbardiv.align = "center"

                    document.body.appendChild(songdiv)
                    document.body.appendChild(progressbardiv)

                    audio.play()
                }
            }

            function shuffle(array)
            {
                let currentIndex = array.length;

                while (currentIndex != 0) 
                {
                    let randomIndex = Math.floor(rand(0,currentIndex-1));
                    currentIndex--;

                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
            }

            function pad(num, size) 
            {
                s = num + '';
                while (s.length < size) {s = '0' + s;}
                return s;
            }

            function rand(min, max){
                return (Math.floor(Math.pow(10,14)*Math.random()*Math.random())%(max-min+1))+min;
            }

            document.addEventListener("change", createfilearray)
            document.addEventListener("keydown", (e) => 
            {
                if (e.key == "d")
                {
                    goforward()
                }
                else if (e.key == "a")
                {
                    goback()
                }
                else if (e.key == " ")
                {
                    pausesong()
                }
            })
            
            function pausesong()
            {
                audio = document.body.children[static_element_num].children[1]

                if(!audio.paused)
                    audio.pause()
                else
                    audio.play()
            }

            function goforward()
            {
                if (pindex < playlist.length-1)
                    {pindex++}
                else
                    {
                        shuffle(playlist)
                        pindex = 0
                    }
                    
                playsong()
            }

            function goback()
            {
                if (pindex > 0)
                {
                    pindex--
                    playsong()
                }
            }

            function updatetimer()
            {
                //document.body.(songdiv).(audio)
                audio = document.body.children[static_element_num].children[1]
                time = audio.duration - audio.currentTime

                if (time <= 0)
                    goforward()

                time = pad(Math.floor(time / 60),2) + ":" + pad(Math.floor(time % 60),2)

                //document.body.(songdiv).(songinfo).(timer)
                document.body.children[static_element_num].children[2].innerHTML = time
                
                //change progress slider
                slider = document.body.children[static_element_num+1].children[0]

                document.body.children[static_element_num+1].children[0].value = audio.currentTime

                pc = (slider.value - slider.min) / (slider.max - slider.min) * 100;
                if (pc < 20) {pc++}
                slider.style.setProperty('--pc', pc + '%');
            }

            //update every 250ms
            setInterval(updatetimer, 250)

//--------------------| MOBILE CONTROLS |-------------------------------------------------------------------------------------------------------------------------

            let tsx = 0
            let tsy = 0

            document.addEventListener("touchstart", (e) =>
            {
                tsx = e.touches[0].clientX
                tsy = e.touches[0].clientY
            })
            document.addEventListener("touchend", (e) =>
            {
                xdir = e.changedTouches[0].clientX - tsx;
                ydir = e.changedTouches[0].clientY - tsy;

                if (window.innerHeight*.7 > tsy && window.innerHeight*.2 < tsy)
                {
                    if(xdir < -150)
                        goforward()
                    else if(xdir > 150)
                        goback()
                    else if (xdir > -11 && xdir < 11 && ydir > -11 && ydir < 11)
                        pausesong()
                }
            })

        </script>

    </body>

</html>
